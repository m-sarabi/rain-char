<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Rain - Advanced Demo</title>
    <link rel="stylesheet" href="./demo/style_v2.0.css">
    <script src="https://cdn.jsdelivr.net/npm/rain-char@2.0.1"></script>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div class="controls">
    <h3>RainChar Controls</h3>
    <div class="control-grid">
        <div class="button-group">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="stop-btn">Stop</button>
        </div>

        <div class="control-group">
            <label for="density-input">Density</label>
            <input type="number" id="density-input" min="0" max="1" step="1">
        </div>

        <div class="control-group">
            <label for="trail-input">Trail Fade <small>(low=long)</small></label>
            <input type="number" id="trail-input" min="0.1" max="5" step="0.1">
        </div>

        <div class="control-group">
            <label for="fg-color">Foreground</label>
            <input type="color" id="fg-color">
        </div>

        <div class="control-group">
            <label for="bg-color">Background</label>
            <input type="color" id="bg-color">
        </div>

        <div class="control-group full-width">
            <label>Font Size (<label for="min-size-input">Min</label> / <label for="max-size-input">Max</label>)</label>
            <div class="inline-inputs">
                <input type="number" id="min-size-input" min="5" max="100">
                <input type="number" id="max-size-input" min="5" max="100">
            </div>
        </div>

        <div class="control-group">
            <label for="spacing-input">Spacing</label>
            <input type="number" id="spacing-input" min="0.1" max="5" step="0.1">
        </div>

        <div class="control-group">
            <label for="change-freq-input">Change Freq.</label>
            <input type="number" id="change-freq-input" min="0" max="1" step="0.05">
        </div>

        <div class="control-group full-width">
            <label for="charset-select">Character Set</label>
            <select id="charset-select">
                <option value="kana">Hiragana & Katakana</option>
                <option value="ascii">ASCII</option>
                <option value="binary">Binary</option>
                <option value="cyrillic">Cyrillic</option>
                <option value="emoji">Emoji (Simple)</option>
                <option value="numbers">Numbers</option>
            </select>
        </div>

        <div class="control-group">
            <label for="fps-input">Max FPS</label>
            <input type="number" id="fps-input" min="5" max="120" step="1">
        </div>

    </div>
</div>

<script src="./demo/script_v2.0.js"></script>
</body>
</html>
